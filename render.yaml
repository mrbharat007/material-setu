databases:
  - name: material-setu-db
    databaseName: material_setu
    user: material_setu
    plan: free

services:
  # Backend API
  - type: web
    name: material-setu-api
    env: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: material-setu-db
          property: connectionString
      - key: CORS_ORIGINS
        value: "*"
      - key: MATERIAL_SETU_SECRET
        generateValue: true
      - key: MATERIAL_SETU_TOKEN_TTL
        value: "86400"

  # Frontend UI
  - type: web
    name: material-setu-ui
    env: static
    plan: free
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API
        fromService:
          type: web
          name: material-setu-api
          property: host
