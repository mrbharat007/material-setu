services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: material_setu
      POSTGRES_USER: material_setu
      POSTGRES_PASSWORD: material_setu_dev
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro

volumes:
  pgdata:
